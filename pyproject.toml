[project]
name = "siniear-call"
version = "0.1.0"
description = "Siniear Call backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.28,<1",
    "google-genai>=1,<3",
]

[dependency-groups]
dev = [
    "alembic>=1.14,<2",
    "httpx2>=2.16,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
